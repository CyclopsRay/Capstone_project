# Software environment of this project, managed by Pixi (https://pixi.sh).
# Pixi installs it from pixi.lock, which records the exact build of every
# package for every platform: commit both files. Add a package with
# `pixi add <name>`; list the tasks with `pixi task list`.
[workspace]
name = "undetect-demo"
description = "A reproducible pipeline that trains and tests UnDetect on simulated data"
authors = ["Yuqi Lei", "Hanzhe Liang", "Keqin Peng", "Jun Wen"]
channels = ["conda-forge", "bioconda"]
# Tested on Linux x86-64 (GitHub Actions) and macOS on Apple silicon
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
license = "MIT"
repository = "https://github.com/CyclopsRay/Capstone_project"
requires-pixi = ">=0.60.0"

[dependencies]
python = "3.12.*"
numpy = "1.26.4.*"
pandas = "2.2.3.*"
pytorch = { version = "2.4.1.*", build = "cpu_generic*" }   # CPU build, without MKL: a smaller download
rdkit = "2024.03.6.*"
pyyaml = ">=6"
matplotlib-base = ">=3.9,<3.11"   # without the Qt GUI libraries
snakemake-minimal = ">=9"          # bioconda
quarto = ">=1.9"
ipykernel = ">=6"                  # Quarto runs the report's Python code in a Jupyter kernel
nbclient = ">=0.10"
nbformat = ">=5.10"
pytest = ">=8"

[tasks]
reproduce = { cmd = "snakemake --cores all", description = "Run the whole pipeline: download, simulate, train and test on 5 folds, evaluate, report" }
dry-run = { cmd = "snakemake --cores all --dry-run", description = "List the steps that `reproduce` would run now, and why" }
download = { cmd = "python scripts/download_data.py", description = "Download the raw data and check it against the recorded checksums" }
report = { cmd = "quarto render reports/undetect-demo.qmd", description = "Render the report again from the current results" }
test = { cmd = "pytest -q tests", description = "Run the unit tests" }
