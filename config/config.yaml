# Settings of the pipeline. Change a setting here, not in the code:
# `pixi run reproduce` then reruns the steps that depend on it.

data:
  compound_table: data/raw/clue/compoundinfo_beta.txt  # downloaded, see metadata/sources.tsv
  processed: data/processed                            # the simulated data
results: results

# Simulated data (scripts/simulate_data.py)
simulation:
  seed: 2027
  genes: 978                 # L1000 landmark genes
  moa_classes: 24            # compounds come from this many mechanism-of-action classes
  compounds_per_class: 10    # 24 x 10 = 240 real compounds
  cell_lines: 8
  plates_per_line: 6
  lines_per_compound: [3, 8] # each compound is measured in 3 to 8 cell lines
  cell_painting_share: 0.6   # share of compounds with a Cell Painting profile
  morph_features: 64
  gene_programs: 20          # compound effects lie in this many gene programs
  # How much each compound view contributes to the simulated compound effects
  view_weights: {chem: 0.4, tgt: 0.2, moa: 0.25, morph: 0.15}
  # Standard deviations (per gene) of the parts of a response
  context_sd: 1.0            # nonlinear function of the control profile
  plate_sd: 0.5              # shared by the samples of one assay plate
  compound_sd: 1.0           # compound effect, shared by all cell lines
  line_compound_sd: 0.4      # compound effect specific to one cell line
  line_sensitivity_sd: 0.3   # log-scale spread of the cell lines' sensitivity
  gate_strength: 0.3         # per-gene rescaling by the control's top principal components
  noise_sd: 1.0
  split_seed: 131419         # shuffles the compounds into 5 groups

# UnDetect (scripts/train.py)
model:
  seed: 1729
  epochs: 100                # most epochs of the backbone; training stops early on the validation compounds
  patience: 10               # epochs without improvement before it stops
  folds: [0, 1, 2, 3, 4]
  threads_per_fold: 2        # CPU threads per fold; Snakemake runs folds in parallel
