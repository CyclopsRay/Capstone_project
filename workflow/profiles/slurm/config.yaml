# Run the workflow's steps as Slurm jobs, from the cluster's login node:
#   pixi run snakemake --profile workflow/profiles/slurm
# The partition and QOS are those of the cluster the paper's job scripts used
# (slurm/*.sbatch); change them for yours. Not tested on a cluster yet.
executor: slurm
jobs: 10
latency-wait: 60
default-resources:
  slurm_partition: "cscc-cpu-p"
  slurm_extra: "'--qos=cscc-cpu-qos'"
  mem_mb: 8000
  runtime: 30
